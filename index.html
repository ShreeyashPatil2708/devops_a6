<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DevOps Demo</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: #fff;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #2d2d44;
      padding: 40px 60px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }
    h1 { color: #4cd3a0; margin-bottom: 10px; }
    p { color: #cfcfcf; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from DevOps Demo</h1>
    <p>This page was checked out and built by a Jenkins pipeline.</p>
  </div>
</body>
</html>
